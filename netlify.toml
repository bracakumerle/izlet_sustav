[build]
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  included_files = ["data/*.json"]

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# CORS for Netlify Functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, OPTIONS"

# Correct Content-Type for sitemap.xml
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Hide internal system artifacts from the public surface (never expose internal mechanics)
[[redirects]]
  from = "/master_registry.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/works_registry.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/events_registry.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/metrics_registry.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/client_secrets.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CANONICAL_CHANGES.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CANONICAL_STATE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/registries/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/izlet_os/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/logs/*"
  to = "/404.html"
  status = 404
  force = true

# Friendly redirect: /spotify → function
[[redirects]]
  from   = "/api/spotify"
  to     = "/.netlify/functions/spotify"
  status = 200
