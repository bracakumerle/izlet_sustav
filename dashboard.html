<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iZLET – Dashboard | Braća Kumerle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --surface: #111;
      --card:    #141414;
      --border:  #1e1e1e;
      --accent:  #c8a84b;
      --accent2: #e8c96b;
      --text:    #e8e8e8;
      --muted:   #555;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ── HEADER ── */
    .header {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    .header-left { display: flex; align-items: baseline; gap: 1rem; }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, var(--accent2) 60%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .page-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .refresh-btn {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: none;
      border: 1px solid var(--accent);
      border-radius: 1rem;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .refresh-btn:hover { background: var(--accent); color: #000; }

    /* ── SECTION DIVIDER ── */
    .section-divider {
      max-width: 1100px;
      margin: 2rem auto 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-divider-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── GRID ── */
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .card-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-icon svg { width: 16px; height: 16px; }
    .icon-spotify   { background: #1DB954; }
    .icon-mb        { background: #ba478f; }
    .icon-wikidata  { background: #006699; }
    .icon-youtube   { background: #FF0000; }
    .icon-discogs   { background: #333; }
    .icon-wikipedia { background: #3366cc; }
    .icon-system    { background: #1a7a40; }
    .icon-facebook  { background: #1877F2; }

    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
    }

    .card-status {
      margin-left: auto;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      font-weight: 600;
    }

    .status-loading { background: #222; color: var(--muted); }
    .status-ok      { background: rgba(29,185,84,0.15); color: #1DB954; }
    .status-error   { background: rgba(224,80,57,0.15); color: #e05039; }
    .status-warn    { background: rgba(224,168,57,0.15); color: #e0a839; }

    .card-body {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── ARTIST HERO ── */
    .artist-hero { display: flex; gap: 1rem; align-items: center; }

    .artist-img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
      flex-shrink: 0;
    }

    .artist-info { flex: 1; min-width: 0; }

    .artist-name {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .artist-meta span { white-space: nowrap; }

    /* ── PILL LIST ── */
    .pill-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .pill {
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.55rem;
      border-radius: 1rem;
      background: rgba(200,168,75,0.12);
      color: var(--accent2);
      text-transform: capitalize;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    /* ── TRACK LIST ── */
    .track-list { display: flex; flex-direction: column; gap: 0.4rem; }

    .track {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      transition: background 0.12s;
      text-decoration: none;
      color: inherit;
    }

    .track:hover { background: rgba(255,255,255,0.04); }

    .track-num {
      font-size: 0.7rem;
      color: var(--muted);
      width: 1.2rem;
      text-align: center;
      flex-shrink: 0;
    }

    .track-img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      background: var(--border);
      flex-shrink: 0;
    }

    .track-info { flex: 1; min-width: 0; }

    .track-name {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-album {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-dur { font-size: 0.68rem; color: var(--muted); flex-shrink: 0; }

    /* ── ALBUM GRID ── */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.6rem;
    }

    .album-card {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-decoration: none;
      color: inherit;
    }

    .album-card:hover .album-img { opacity: 0.8; }

    .album-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      object-fit: cover;
      background: var(--border);
      transition: opacity 0.15s;
    }

    .album-name {
      font-size: 0.65rem;
      line-height: 1.3;
      color: #aaa;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .album-year { font-size: 0.6rem; color: var(--muted); }

    /* ── STAT ROWS ── */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .stat-row:last-child { border-bottom: none; }
    .stat-key  { color: var(--muted); font-size: 0.72rem; }
    .stat-val  { font-weight: 600; text-align: right; }

    .stat-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.72rem;
      font-family: 'Courier New', monospace;
    }
    .stat-link:hover { text-decoration: underline; }

    /* ── ENTITY BLOCK ── */
    .entity-block {
      padding: 0.75rem;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .entity-qid { font-size: 0.65rem; font-family: 'Courier New', monospace; color: var(--accent); margin-bottom: 0.3rem; }
    .entity-label { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.15rem; }
    .entity-desc { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.5rem; }
    .entity-props { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    /* ── WIKI EXTRACT ── */
    .wiki-extract {
      font-size: 0.8rem;
      line-height: 1.7;
      color: #aaa;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .wiki-thumb {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--border);
    }

    /* ── VIDEO LIST ── */
    .video-list { display: flex; flex-direction: column; gap: 0.4rem; }

    .video-item {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
    }

    .video-item:hover { background: rgba(255,255,255,0.04); }

    .video-thumb {
      width: 56px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--border);
      flex-shrink: 0;
    }

    .video-title {
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .video-date { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; }

    /* ── SYSTEM STATUS ── */
    .agent-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      margin-bottom: 0.3rem;
      font-size: 0.8rem;
    }

    .agent-name { color: var(--muted); font-size: 0.72rem; }

    .badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      font-weight: 700;
    }

    .badge-ok   { background: rgba(29,185,84,0.15); color: #1DB954; }
    .badge-warn { background: rgba(224,168,57,0.15); color: #e0a839; }
    .badge-err  { background: rgba(224,80,57,0.15);  color: #e05039; }

    /* ── FACEBOOK POSTS ── */
    .fb-post {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .fb-post-msg {
      font-size: 0.78rem;
      line-height: 1.5;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fb-post-date { font-size: 0.65rem; color: var(--muted); }

    /* ── FOOTER ── */
    .dash-footer {
      max-width: 1100px;
      margin: 2.5rem auto 0;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .dash-footer a { color: var(--accent); text-decoration: none; }

    /* ── SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, #1a1a1a 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-block { height: 5rem; border-radius: 8px; }
    .skeleton-line  { height: 0.75rem; margin-bottom: 0.5rem; }
    .skeleton-line.short { width: 60%; }

    /* ── ERROR ── */
    .error-msg {
      font-size: 0.78rem;
      color: #e05039;
      padding: 0.75rem;
      background: rgba(224,80,57,0.08);
      border-radius: 6px;
      border: 1px solid rgba(224,80,57,0.2);
    }

    @media (max-width: 480px) {
      body { padding: 1rem 0.75rem 3rem; }
      .logo { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="logo" href="/">iZLET</a>
    <span class="page-label">Live Dashboard</span>
  </div>
  <button class="refresh-btn" onclick="loadAll()">↺ Osvježi</button>
</div>

<!-- ══════════════ ROW 1: MUSIC DATABASES ══════════════ -->
<div class="section-divider">
  <span class="section-divider-label">Glazbene baze</span>
  <div class="section-divider-line"></div>
</div>

<div class="grid">

  <!-- SPOTIFY -->
  <div class="card" id="card-spotify">
    <div class="card-header">
      <div class="card-icon icon-spotify">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>

      <span class="card-title">Spotify</span>
      <span class="card-status status-loading" id="status-spotify">Učitavam…</span>
    </div>
    <div class="card-body" id="body-spotify">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

  <!-- MUSICBRAINZ -->
  <div class="card" id="card-mb">
    <div class="card-header">
      <div class="card-icon icon-mb">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      </div>
      <span class="card-title">MusicBrainz</span>
      <span class="card-status status-loading" id="status-mb">Učitavam…</span>
    </div>
    <div class="card-body" id="body-mb">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

  <!-- WIKIDATA -->
  <div class="card" id="card-wd">
    <div class="card-header">
      <div class="card-icon icon-wikidata">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M4.002 3v18h1.5V3zm1.996 0v18h4.5V3zm6.496 0v18h1.5V3zm3.004 0v18h4.5V3z"/></svg>
      </div>
      <span class="card-title">Wikidata</span>
      <span class="card-status status-loading" id="status-wd">Učitavam…</span>
    </div>
    <div class="card-body" id="body-wd">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

</div>

<!-- ══════════════ ROW 2: PLATFORMS & KNOWLEDGE ══════════════ -->
<div class="section-divider">
  <span class="section-divider-label">Platforme &amp; Znanje</span>
  <div class="section-divider-line"></div>
</div>

<div class="grid">

  <!-- YOUTUBE -->
  <div class="card" id="card-youtube">
    <div class="card-header">
      <div class="card-icon icon-youtube">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </div>
      <span class="card-title">YouTube</span>
      <span class="card-status status-loading" id="status-youtube">Učitavam…</span>
    </div>
    <div class="card-body" id="body-youtube">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

  <!-- DISCOGS -->
  <div class="card" id="card-discogs">
    <div class="card-header">
      <div class="card-icon icon-discogs">
        <svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <span class="card-title">Discogs</span>
      <span class="card-status status-loading" id="status-discogs">Učitavam…</span>
    </div>
    <div class="card-body" id="body-discogs">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

  <!-- WIKIPEDIA -->
  <div class="card" id="card-wikipedia">
    <div class="card-header">
      <div class="card-icon icon-wikipedia">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.09 13.119c-.936 1.932-2.217 4.548-2.853 5.728-.616 1.074-1.127.931-1.532.029-1.406-3.321-4.293-9.144-5.651-12.409-.251-.601-.441-.987-.619-1.139-.181-.15-.554-.24-1.122-.271C.103 5.033 0 4.982 0 4.898v-.455l.052-.045c.924-.005 5.401 0 5.401 0l.051.045v.434c0 .119-.075.176-.225.176l-.564.031c-.485.029-.727.164-.727.436 0 .135.053.33.166.601 1.082 2.636 4.264 9.113 5.397 11.615l.053.1 1.369-2.868-1.025-2.49-1.305-3.029c-.243-.56-.592-.863-1.049-.914l-.363-.03c-.135-.021-.2-.086-.2-.196v-.451l.051-.045c1.054-.005 4.274 0 4.274 0l.05.045v.408c0 .124-.076.18-.227.18l-.434.031c-.485.029-.727.164-.727.436 0 .176.099.444.297.806l.777 1.693c.222-.478.554-1.158.777-1.635.27-.551.418-.898.449-1.042.03-.126.045-.247.045-.361 0-.27-.228-.417-.683-.444l-.422-.031c-.121-.021-.181-.086-.181-.196v-.451l.05-.045c.754-.005 3.224 0 3.224 0l.051.045v.408c0 .124-.076.18-.228.18l-.378.031c-.453.029-.679.166-.679.438 0 .135.05.33.157.601l.795 1.747 1.083-2.426c.135-.3.203-.527.203-.681 0-.27-.228-.417-.683-.444l-.422-.031c-.121-.021-.181-.086-.181-.196v-.451l.05-.045c.754-.005 2.521 0 2.521 0l.051.045v.408c0 .124-.076.18-.228.18l-.34.031c-.416.034-.722.156-.916.362-.195.207-.534.776-1.012 1.708l-1.023 2.126 1.275 2.834c.203-.44.542-1.139.766-1.622.248-.52.392-.863.432-.994.04-.127.059-.247.059-.366 0-.275-.23-.424-.69-.451l-.422-.031c-.121-.021-.181-.086-.181-.196v-.451l.05-.045c.751-.005 3.023 0 3.023 0l.051.045v.408c0 .124-.076.18-.228.18l-.378.031c-.343.025-.602.118-.769.285-.169.165-.481.704-.934 1.617z"/></svg>
      </div>
      <span class="card-title">Wikipedia / Wikidata</span>
      <span class="card-status status-loading" id="status-wikipedia">Učitavam…</span>
    </div>
    <div class="card-body" id="body-wikipedia">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

  <!-- SYSTEM STATUS -->
  <div class="card" id="card-system">
    <div class="card-header">
      <div class="card-icon icon-system">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </div>
      <span class="card-title">System Status</span>
      <span class="card-status status-loading" id="status-system">Učitavam…</span>
    </div>
    <div class="card-body" id="body-system">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

</div>

<!-- ══════════════ ROW 3: SOCIAL MEDIA ══════════════ -->
<div class="section-divider">
  <span class="section-divider-label">Društvene mreže</span>
  <div class="section-divider-line"></div>
</div>

<div class="grid">

  <!-- FACEBOOK -->
  <div class="card" id="card-facebook">
    <div class="card-header">
      <div class="card-icon icon-facebook">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
      </div>
      <span class="card-title">Facebook</span>
      <span class="card-status status-loading" id="status-facebook">Učitavam…</span>
    </div>
    <div class="card-body" id="body-facebook">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>
  </div>

</div>

<p class="dash-footer">
  <a href="/">← Početna</a> &nbsp;·&nbsp;
  iZLET – Braća Kumerle &nbsp;·&nbsp;
  <span id="last-updated">—</span>
</p>

<script>
  const FN = (name) => `/.netlify/functions/${name}`;
  const MB_SNAP = '/data/mb_snapshot.json';
  const WD_SNAP = '/data/wikidata_snapshot.json';

  function fmt_ms(ms) {
    if (!ms) return '—';
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function fmt_num(n) { return n == null ? '—' : n.toLocaleString('hr'); }

  function fmt_date(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('hr', { year:'numeric', month:'short', day:'numeric' });
  }

  function set_status(id, type, text) {
    const el = document.getElementById('status-' + id);
    el.className = 'card-status status-' + type;
    el.textContent = text;
  }

  function skeleton_html() {
    return `<div class="skeleton skeleton-block"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line short"></div>`;
  }

  function render_error(id, msg) {
    set_status(id, 'error', 'Greška');
    document.getElementById('body-' + id).innerHTML =
      `<div class="error-msg">⚠ ${msg}</div>`;
  }

  // ── SPOTIFY ────────────────────────────────────────────────────────────────
  async function load_spotify() {
    try {
      const r = await fetch(FN('spotify'));
      const d = await r.json();
      if (d.error) throw new Error(d.error);

      const a   = d.artist;
      const top = (d.top_tracks || []).slice(0, 8);
      const alb = (d.albums     || []).slice(0, 8);

      set_status('spotify', 'ok', `${fmt_num(a.followers)} pratitelja`);

      document.getElementById('body-spotify').innerHTML = `
        <div class="artist-hero">
          ${a.image ? `<img class="artist-img" src="${a.image}" alt="${a.name}" loading="lazy">` : '<div class="artist-img"></div>'}
          <div class="artist-info">
            <div class="artist-name">${a.name}</div>
            <div class="artist-meta">
              <span>♥ ${fmt_num(a.followers)}</span>
              <span>◉ Popularity: ${a.popularity}</span>
            </div>
          </div>
        </div>
        ${a.genres?.length ? `<div><div class="section-label">Žanrovi</div><div class="pill-list">${a.genres.map(g=>`<span class="pill">${g}</span>`).join('')}</div></div>` : ''}
        ${top.length ? `<div><div class="section-label">Top pjesme</div><div class="track-list">${top.map((t,i)=>`
          <a class="track" href="${t.external_url}" target="_blank" rel="noopener">
            <span class="track-num">${i+1}</span>
            ${t.album?.image ? `<img class="track-img" src="${t.album.image}" alt="" loading="lazy">` : '<div class="track-img"></div>'}
            <div class="track-info"><div class="track-name">${t.name}</div><div class="track-album">${t.album?.name||''}</div></div>
            <span class="track-dur">${fmt_ms(t.duration_ms)}</span>
          </a>`).join('')}</div></div>` : ''}
        ${alb.length ? `<div><div class="section-label">Diskografija</div><div class="album-grid">${alb.map(a=>`
          <a class="album-card" href="${a.external_url}" target="_blank" rel="noopener">
            ${a.image ? `<img class="album-img" src="${a.image}" alt="${a.name}" loading="lazy">` : '<div class="album-img"></div>'}
            <div class="album-name">${a.name}</div>
            <div class="album-year">${(a.release_date||'').slice(0,4)}</div>
          </a>`).join('')}</div></div>` : ''}
        <div class="stat-row"><span class="stat-key">Spotify ID</span><a class="stat-link" href="${a.external_url}" target="_blank" rel="noopener">${a.id}</a></div>
        <div class="stat-row"><span class="stat-key">Dohvaćeno</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(d.fetched_at)}</span></div>
      `;
    } catch (err) { render_error('spotify', err.message); }
  }

  // ── MUSICBRAINZ ───────────────────────────────────────────────────────────
  async function load_mb() {
    try {
      const r = await fetch(MB_SNAP);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d   = await r.json();
      const a   = d.artist;
      const rgs = d.release_groups || [];
      const recs = d.recordings    || [];

      set_status('mb', 'ok', `${d.stats?.recording_count} snimki`);

      const albums  = rgs.filter(r => r.type === 'Album');
      const singles = rgs.filter(r => r.type === 'Single');

      document.getElementById('body-mb').innerHTML = `
        <div>
          <div class="stat-row"><span class="stat-key">Ime</span><span class="stat-val">${a.name}</span></div>
          <div class="stat-row"><span class="stat-key">Tip</span><span class="stat-val">${a.type||'—'}</span></div>
          <div class="stat-row"><span class="stat-key">Zemlja</span><span class="stat-val">${a.country||'—'}</span></div>
          <div class="stat-row"><span class="stat-key">Osnovan</span><span class="stat-val">${a.begin||'—'}</span></div>
          <div class="stat-row"><span class="stat-key">Albumi</span><span class="stat-val">${albums.length}</span></div>
          <div class="stat-row"><span class="stat-key">Singlovi</span><span class="stat-val">${singles.length}</span></div>
          <div class="stat-row"><span class="stat-key">Snimke</span><span class="stat-val">${recs.length}</span></div>
          <div class="stat-row"><span class="stat-key">Alias</span><span class="stat-val">${(a.aliases||[]).join(', ')||'—'}</span></div>
        </div>
        ${a.tags?.length ? `<div><div class="section-label">Tagovi</div><div class="pill-list">${a.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div></div>` : ''}
        <div><div class="section-label">Izdanja</div><div class="track-list">${rgs.map(rg=>`
          <a class="track" href="https://musicbrainz.org/release-group/${rg.id}" target="_blank" rel="noopener">
            <div class="track-info"><div class="track-name">${rg.title}</div><div class="track-album">${rg.type} · ${(rg.first_release_date||'').slice(0,4)}</div></div>
          </a>`).join('')}</div></div>
        <div class="stat-row"><span class="stat-key">MBID</span><a class="stat-link" href="https://musicbrainz.org/artist/${d.mbid}" target="_blank" rel="noopener">${d.mbid.slice(0,8)}…</a></div>
        <div class="stat-row"><span class="stat-key">Snapshot</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(d.fetched_at)}</span></div>
      `;
    } catch (err) { render_error('mb', err.message); }
  }

  // ── WIKIDATA ──────────────────────────────────────────────────────────────
  async function load_wd() {
    try {
      const r = await fetch(WD_SNAP);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      const entities = d.entities || {};

      set_status('wd', 'ok', `${Object.keys(entities).length} entiteta`);

      const blocks = Object.values(entities).map(e => {
        const label = e.labels?.hr || e.labels?.en || e.qid;
        const desc  = e.descriptions?.hr || e.descriptions?.en || '';
        const props = [];
        if (e.spotify_artist_id?.length)     props.push(`Spotify: ${e.spotify_artist_id[0]}`);
        if (e.musicbrainz_artist_id?.length) props.push(`MB: ${e.musicbrainz_artist_id[0].slice(0,8)}…`);
        if (e.youtube_channel_id?.length)    props.push(`YT: ${e.youtube_channel_id[0]}`);
        if (e.official_website?.length)      props.push(`Web: ${e.official_website[0].replace(/^https?:\/\//,'')}`);
        if (e.inception?.length)             props.push(`Osnovan: ${e.inception[0].replace(/^\+(\d{4}).*/,'$1')}`);
        return `<div class="entity-block">
          <div class="entity-qid"><a class="stat-link" href="https://www.wikidata.org/wiki/${e.qid}" target="_blank" rel="noopener">${e.qid}</a></div>
          <div class="entity-label">${label}</div>
          <div class="entity-desc">${desc}</div>
          ${props.length ? `<div class="entity-props">${props.map(p=>`<span class="pill">${p}</span>`).join('')}</div>` : ''}
        </div>`;
      });

      document.getElementById('body-wd').innerHTML = `
        ${blocks.join('')}
        <div class="stat-row"><span class="stat-key">Snapshot</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(d.fetched_at)}</span></div>
      `;
    } catch (err) { render_error('wd', err.message); }
  }

  // ── YOUTUBE ───────────────────────────────────────────────────────────────
  async function load_youtube() {
    try {
      const r = await fetch(FN('youtube'));
      const d = await r.json();
      if (d.error) throw new Error(d.error);

      set_status('youtube', 'ok', `${fmt_num(d.view_count)} pregleda`);

      document.getElementById('body-youtube').innerHTML = `
        <div>
          <div class="stat-row"><span class="stat-key">Kanal</span><a class="stat-link" href="${d.channel_url}" target="_blank" rel="noopener">${d.channel_name || '@bracakumerle'}</a></div>
          <div class="stat-row"><span class="stat-key">Pretplatnici</span><span class="stat-val">${fmt_num(d.subscriber_count)}</span></div>
          <div class="stat-row"><span class="stat-key">Ukupno pregleda</span><span class="stat-val">${fmt_num(d.view_count)}</span></div>
          <div class="stat-row"><span class="stat-key">Videa</span><span class="stat-val">${fmt_num(d.video_count)}</span></div>
        </div>
        ${d.latest_videos?.length ? `
        <div>
          <div class="section-label">Najnoviji videi</div>
          <div class="video-list">
            ${d.latest_videos.map(v => `
              <a class="video-item" href="${v.url}" target="_blank" rel="noopener">
                ${v.thumbnail ? `<img class="video-thumb" src="${v.thumbnail}" alt="" loading="lazy">` : '<div class="video-thumb"></div>'}
                <div class="video-title">${v.title}</div>
                <span class="video-date">${fmt_date(v.published_at)}</span>
              </a>`).join('')}
          </div>
        </div>` : ''}
        <div class="stat-row"><span class="stat-key">Channel ID</span><span class="stat-val" style="font-size:0.65rem;font-family:monospace;color:var(--muted)">${d.channel_id}</span></div>
      `;
    } catch (err) { render_error('youtube', err.message); }
  }

  // ── DISCOGS ───────────────────────────────────────────────────────────────
  async function load_discogs() {
    try {
      const r = await fetch(FN('discogs'));
      const d = await r.json();
      if (d.error) throw new Error(d.error);

      const total = d.pagination?.total_releases || d.releases?.length || 0;
      set_status('discogs', 'ok', `${total} izdanja`);

      const artist = d.artist || {};
      const label  = d.label  || {};
      const rels   = (d.releases || []).slice(0, 8);

      document.getElementById('body-discogs').innerHTML = `
        ${artist.images?.[0] ? `<img class="wiki-thumb" src="${artist.images[0]}" alt="${artist.name}" loading="lazy">` : ''}
        <div>
          <div class="stat-row"><span class="stat-key">Artist</span><a class="stat-link" href="${artist.discogs_url}" target="_blank" rel="noopener">${artist.name}</a></div>
          <div class="stat-row"><span class="stat-key">Label</span><a class="stat-link" href="${label.discogs_url}" target="_blank" rel="noopener">${label.name||'—'}</a></div>
          <div class="stat-row"><span class="stat-key">Data Quality</span><span class="stat-val">${artist.data_quality||'—'}</span></div>
          <div class="stat-row"><span class="stat-key">Ukupno izdanja</span><span class="stat-val">${total}</span></div>
        </div>
        ${artist.profile ? `<div class="wiki-extract">${artist.profile.replace(/\[.*?\]/g,'')}</div>` : ''}
        ${rels.length ? `
        <div>
          <div class="section-label">Izdanja</div>
          <div class="track-list">
            ${rels.map(rel => `
              <a class="track" href="https://www.discogs.com/release/${rel.id}" target="_blank" rel="noopener">
                ${rel.thumb ? `<img class="track-img" src="${rel.thumb}" alt="" loading="lazy">` : '<div class="track-img"></div>'}
                <div class="track-info">
                  <div class="track-name">${rel.title}</div>
                  <div class="track-album">${rel.type||''} ${rel.year ? '· '+rel.year : ''}</div>
                </div>
              </a>`).join('')}
          </div>
        </div>` : ''}
      `;
    } catch (err) { render_error('discogs', err.message); }
  }

  // ── WIKIPEDIA ─────────────────────────────────────────────────────────────
  async function load_wikipedia() {
    try {
      const r = await fetch(FN('wikipedia'));
      const d = await r.json();
      if (d.error) throw new Error(d.error);

      const wiki = d.wikipedia || {};
      const wd   = d.wikidata  || {};

      const found = wiki.found !== false;
      set_status('wikipedia', found ? 'ok' : 'warn', found ? 'Wikipedia HR ✓' : 'Nema članka');

      document.getElementById('body-wikipedia').innerHTML = `
        ${wiki.thumbnail ? `<img class="wiki-thumb" src="${wiki.thumbnail}" alt="${wiki.title}" loading="lazy">` : ''}
        ${wiki.extract ? `<div class="wiki-extract">${wiki.extract}</div>` : '<div class="error-msg" style="color:#e0a839;background:rgba(224,168,57,0.08);border-color:rgba(224,168,57,0.2);">⚠ Članak nije pronađen na hr.wikipedia.org</div>'}
        <div>
          ${wiki.url ? `<div class="stat-row"><span class="stat-key">Wikipedia</span><a class="stat-link" href="${wiki.url}" target="_blank" rel="noopener">hr.wikipedia.org/wiki/IZLET</a></div>` : ''}
          <div class="stat-row"><span class="stat-key">Zadnja izmjena</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${wiki.last_edited ? fmt_date(wiki.last_edited) : '—'}</span></div>
          <div class="stat-row"><span class="stat-key">Wikidata QID</span><a class="stat-link" href="${wd.url}" target="_blank" rel="noopener">${wd.qid}</a></div>
          <div class="stat-row"><span class="stat-key">Label HR</span><span class="stat-val">${wd.label_hr||'—'}</span></div>
          <div class="stat-row"><span class="stat-key">Opis HR</span><span class="stat-val" style="font-size:0.7rem;color:#aaa;text-align:right;max-width:60%">${wd.desc_hr||'—'}</span></div>
          ${wd.founded ? `<div class="stat-row"><span class="stat-key">Osnovan</span><span class="stat-val">${wd.founded}</span></div>` : ''}
          ${wd.spotify_id ? `<div class="stat-row"><span class="stat-key">Spotify ID</span><span class="stat-val" style="font-size:0.65rem;font-family:monospace;color:var(--muted)">${wd.spotify_id}</span></div>` : ''}
        </div>
      `;
    } catch (err) { render_error('wikipedia', err.message); }
  }

  // ── SYSTEM ────────────────────────────────────────────────────────────────
  async function load_system() {
    try {
      const r = await fetch(FN('system'));
      const d = await r.json();
      if (d.error) throw new Error(d.error);

      set_status('system', 'ok', 'Online');

      const agents = (d.agents_status || '').split(' ').filter(Boolean);

      const yt = d.youtube;
      const mb = d.musicbrainz;
      const wd = d.wikidata;

      document.getElementById('body-system').innerHTML = `
        <div>
          <div class="stat-row"><span class="stat-key">Zadnji run</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(d.last_run)}</span></div>
          <div class="stat-row"><span class="stat-key">Link health</span><span class="stat-val">${d.urls_verified}</span></div>
          <div class="stat-row"><span class="stat-key">Commit</span><span class="stat-val" style="font-family:monospace;font-size:0.75rem">${d.commit||'—'}</span></div>
        </div>

        <div>
          <div class="section-label">Agenti</div>
          <div class="agent-row"><span class="agent-name">Spotify API</span><span class="badge badge-ok">✅ Online</span></div>
          <div class="agent-row"><span class="agent-name">MusicBrainz API</span><span class="badge badge-ok">✅ Online</span></div>
          <div class="agent-row"><span class="agent-name">Wikidata API</span><span class="badge badge-ok">✅ Online</span></div>
          <div class="agent-row"><span class="agent-name">YouTube API</span><span class="badge badge-ok">✅ Online</span></div>
          <div class="agent-row"><span class="agent-name">Discogs API</span><span class="badge badge-ok">✅ Public</span></div>
          <div class="agent-row"><span class="agent-name">Wikipedia API</span><span class="badge badge-ok">✅ Public</span></div>
        </div>

        ${yt ? `<div>
          <div class="section-label">YouTube snapshot</div>
          <div class="stat-row"><span class="stat-key">Videa</span><span class="stat-val">${fmt_num(yt.total_videos)}</span></div>
          <div class="stat-row"><span class="stat-key">Pregleda</span><span class="stat-val">${fmt_num(yt.total_views)}</span></div>
          <div class="stat-row"><span class="stat-key">Najnoviji video</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(yt.latest_video_date)}</span></div>
        </div>` : ''}

        ${mb ? `<div>
          <div class="section-label">MusicBrainz snapshot</div>
          <div class="stat-row"><span class="stat-key">Release grupe</span><span class="stat-val">${mb.release_groups}</span></div>
          <div class="stat-row"><span class="stat-key">Snimke</span><span class="stat-val">${mb.recordings}</span></div>
          <div class="stat-row"><span class="stat-key">Dohvaćeno</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(mb.fetched_at)}</span></div>
        </div>` : ''}

        ${wd ? `<div>
          <div class="section-label">Wikidata state</div>
          <div class="stat-row"><span class="stat-key">Zadnja provjera</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(wd.last_checked)}</span></div>
          <div class="stat-row"><span class="stat-key">Promjena</span><span class="badge ${wd.changed ? 'badge-warn' : 'badge-ok'}">${wd.changed ? '⚠ Da' : '✓ Ne'}</span></div>
          <div class="stat-row"><span class="stat-key">Hash</span><span class="stat-val" style="font-size:0.65rem;font-family:monospace;color:var(--muted)">${wd.hash}</span></div>
        </div>` : ''}
      `;
    } catch (err) { render_error('system', err.message); }
  }

  // ── FACEBOOK ──────────────────────────────────────────────────────────────
  async function load_facebook() {
    try {
      const r = await fetch(FN('facebook'));
      const d = await r.json();
      if (d.error) throw new Error(d.error);

      const pg    = d.page || {};
      const posts = (d.latest_posts || []).slice(0, 3);

      set_status('facebook', 'ok', `${fmt_num(pg.followers_count)} pratitelja`);

      document.getElementById('body-facebook').innerHTML = `
        <div>
          <div class="stat-row"><span class="stat-key">Stranica</span>
            <a class="stat-link" href="https://www.facebook.com/${pg.id}" target="_blank" rel="noopener">${pg.name || '—'}</a>
          </div>
          <div class="stat-row"><span class="stat-key">Pratitelji</span><span class="stat-val">${fmt_num(pg.followers_count)}</span></div>
          <div class="stat-row"><span class="stat-key">Sviđanja</span><span class="stat-val">${fmt_num(pg.fan_count)}</span></div>
          ${pg.about ? `<div class="stat-row"><span class="stat-key">O stranici</span><span class="stat-val" style="font-size:0.7rem;color:#aaa;text-align:right;max-width:65%">${pg.about}</span></div>` : ''}
        </div>
        ${posts.length ? `
        <div>
          <div class="section-label">Zadnje objave</div>
          <div style="display:flex;flex-direction:column;gap:0.5rem;">
            ${posts.map(p => `
              <div class="fb-post">
                <div class="fb-post-msg">${p.message || '(bez teksta)'}</div>
                <div class="fb-post-date">${fmt_date(p.created_time)}</div>
              </div>`).join('')}
          </div>
        </div>` : '<div class="error-msg" style="color:#e0a839;background:rgba(224,168,57,0.08);border-color:rgba(224,168,57,0.2);">Nema objava</div>'}
        <div class="stat-row"><span class="stat-key">Dohvaćeno</span><span class="stat-val" style="font-size:0.7rem;color:var(--muted)">${fmt_date(d.fetched_at)}</span></div>
      `;
    } catch (err) { render_error('facebook', err.message); }
  }

  // ── LOAD ALL ──────────────────────────────────────────────────────────────
  const ALL_IDS = ['spotify','mb','wd','youtube','discogs','wikipedia','system','facebook'];

  async function loadAll() {
    ALL_IDS.forEach(id => {
      set_status(id, 'loading', 'Učitavam…');
      document.getElementById('body-' + id).innerHTML = skeleton_html();
    });

    await Promise.all([
      load_spotify(), load_mb(), load_wd(),
