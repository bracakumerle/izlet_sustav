<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Stranica nije pronađena — iZLET | Braća Kumerle</title>
  <link rel="canonical" href="https://bracakumerle.com/">
  <style>
    :root { --bg:#0f0f0f; --fg:#f4f4f4; --muted:#9a9a9a; --accent:#e0b04a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; text-align:center; padding:2rem; line-height:1.6;
    }
    .wrap { max-width:32rem; }
    .code { font-size:4rem; font-weight:700; letter-spacing:-.03em; color:var(--accent); }
    h1 { font-size:1.35rem; font-weight:600; margin:.75rem 0 .5rem; }
    p { color:var(--muted); margin-bottom:1.75rem; }
    a.home {
      display:inline-block; padding:.7rem 1.4rem; border:1px solid var(--accent);
      color:var(--accent); text-decoration:none; border-radius:.4rem;
      font-weight:600; transition:background .2s,color .2s;
    }
    a.home:hover { background:var(--accent); color:var(--bg); }
    nav { margin-top:2rem; font-size:.85rem; }
    nav a { color:var(--muted); text-decoration:none; margin:0 .6rem; }
    nav a:hover { color:var(--fg); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>Stranica nije pronađena</h1>
    <p>Tražena stranica ne postoji ili je premještena.</p>
    <a class="home" href="/">← Povratak na početnu</a>
    <nav>
      <a href="/bio">O bendu</a>
      <a href="/diskografija">Diskografija</a>
      <a href="/lyrics/">Tekstovi</a>
      <a href="/kontakt">Kontakt</a>
    </nav>
  </main>
</body>
</html>
